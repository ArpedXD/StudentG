<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student G - Login or Signup</title>
    <link rel="stylesheet" href="../CSS/forms.css">
</head>
<body>
    <div class="container">
        <div class="form-box">
            <div class="form-toggle">
                <button id="loginBtn" class="toggle-btn active" onclick="showLogin()">Login</button>
                <button id="signupBtn" class="toggle-btn" onclick="showSignup()">Signup</button>
            </div>

            <div id="loginForm" class="form active-form">
                <h2>Login</h2>
                <input type="Username" id="Username-L" placeholder="username" required>
                <input type="password" id="Password-L" placeholder="Password" required>
                <button onclick="handleLogin()">Login</button>
                <p class="switch-text">Return to <span onclick="window.location.href='../index.html'">Page</span> ?</p>
            </div>

            <div id="signupForm" class="form">
                <h2>Sign Up</h2>
                <input type="text" id="username-S" placeholder="Username" required>
                <input type="email" id="email-S" placeholder="Email" required>
                <input type="password" id="password-S" placeholder="Password" required>
                <input type="password" id="Confirmpassword-S" placeholder="Confirm Password" required>
                <button onclick="handleSignup()">Sign Up</button>
                <p class="switch-text">Return to <span onclick="window.location.href='../index.html'">Page</span> ?</p>
            </div>
        </div>
    </div>
    
    <script src="../JS/JSTOOLS/JSTOOLS.js"></script>
    <script src="../JS/forms.js"></script>
</body>
</html>
